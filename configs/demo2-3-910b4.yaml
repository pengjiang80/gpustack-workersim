# Separate simulator process alongside demo2's 50 B300 Workers.
# Set server.cluster_id to the new cluster's actual ID before starting.
server:
  url: http://127.0.0.1:8080
  allow_version_mismatch: true
  request_timeout: 60
network:
  bind_host: 172.17.0.1
  advertise_address: 172.17.0.1
  worker_ip: 172.17.0.1
  api_port_base: 20400
  metrics_port_base: 20500
  control_port: 20399
  instance_port_start: 43200
  instance_port_end: 43263
simulation:
  namespace: workersim-demo2-910b4
  data_dir: /data
  registration_rate: 2
  reconcile_interval: 30
worker_groups:
  - name_prefix: sim-910b4
    count: 3
    gpu_profile: ascend-910b4-64gb
    gpu_count: 8
    cpu_cores: 128
    memory_gib: 1024
    disk_gib: 4096
    labels:
      environment: workersim-demo2-910b4
