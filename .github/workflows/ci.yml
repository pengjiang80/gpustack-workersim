name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - name: Install dependencies and test tools
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e '.[dev]'
      - name: Check Python sources
        run: python -m ruff check workersim tests scripts
      - name: Run protocol regression tests
        run: |
          ulimit -n 65536
          python -m pytest -q
