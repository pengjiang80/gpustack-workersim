name: Original Server scale acceptance

on:
  workflow_dispatch:
  push:
    branches: ['codex/scale-acceptance']

permissions:
  contents: read

jobs:
  scale:
    name: ${{ matrix.workers }} native Workers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        workers: [500, 1000]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install WorkerSim
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Reserve ports and pull original Server
        run: |
          sudo python scripts/configure_port_reservations.py --workers ${{ matrix.workers }} --expand-ephemeral-range --apply
          docker pull gpustack/gpustack:v2.3.1
      - name: Register native B300 Workers and exercise replicas
        run: |
          ulimit -n 65536
          python -m scripts.scale_acceptance --workers ${{ matrix.workers }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-server-${{ matrix.workers }}-workers
          path: outputs/scale-acceptance/
          if-no-files-found: ignore
