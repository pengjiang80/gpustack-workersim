name: Original Server scale acceptance

on:
  workflow_dispatch:
  push:
    branches: ['codex/scale-acceptance', 'codex/native-source-audit', 'codex/scale-pool-tuned']

permissions:
  contents: read

jobs:
  source-audit:
    if: github.ref_name == 'codex/native-source-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pull image and inspect Worker sources
        run: |
          docker pull gpustack/gpustack:v2.3.1
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.audit_worker_image import audit_image
          output = Path('outputs/native-source')
          output.mkdir(parents=True, exist_ok=True)
          print(json.dumps(audit_image('gpustack/gpustack:v2.3.1', output), indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-source-audit
          path: outputs/native-source/

  scale:
    if: github.ref_name != 'codex/native-source-audit'
    name: ${{ matrix.workers }} native Workers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        workers: ${{ fromJSON(github.ref_name == 'codex/scale-pool-tuned' && '[500]' || '[500,1000]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install WorkerSim
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Reserve ports and pull original Server
        run: |
          sudo python scripts/configure_port_reservations.py --workers ${{ matrix.workers }} --expand-ephemeral-range --apply
          docker pull gpustack/gpustack:v2.3.1
      - name: Register native B300 Workers and exercise replicas
        env:
          TUNED_POOL: ${{ github.ref_name == 'codex/scale-pool-tuned' }}
        run: |
          ulimit -n 65536
          if [ "$TUNED_POOL" = "true" ]; then
            python -m scripts.scale_acceptance --workers ${{ matrix.workers }} --external-postgres --db-pool-size 384 --db-max-overflow 128 --postgres-max-connections 768
          else
            python -m scripts.scale_acceptance --workers ${{ matrix.workers }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-server-${{ matrix.workers }}-workers
          path: outputs/scale-acceptance/
          if-no-files-found: ignore
