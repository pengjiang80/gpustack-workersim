name: Publish Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      update_latest:
        description: Also update the latest image tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dockerhub-publish
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate release version and destination
        id: release
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          LOGIN: ${{ vars.DOCKERHUB_USERNAME }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          python -m scripts.release_metadata
      - uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=GPUStack WorkerSim
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.gpustack.target-version=${{ steps.release.outputs.target_version }}
            io.gpustack.target-commit=${{ steps.release.outputs.target_commit }}
      - name: Verify published image
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm "$IMAGE@$DIGEST" --version
          docker run --rm \
            --mount type=bind,source="$PWD/configs/custom-gpu.yaml",target=/config/fleet.yaml,readonly \
            "$IMAGE@$DIGEST" --config /config/fleet.yaml validate
      - name: Publish compatibility release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          PRODUCT_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --latest \
            --title "$RELEASE_TITLE" --notes-file "docs/releases/$PRODUCT_VERSION.md"
