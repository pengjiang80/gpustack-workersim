name: Publish Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      update_latest:
        description: Also update the latest image tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dockerhub-publish
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate release version and destination
        id: release
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          LOGIN: ${{ vars.DOCKERHUB_USERNAME }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          from workersim import __version__
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert __version__ == version, 'Package and runtime versions must match'
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Use a three-part release version'
          if os.environ['EVENT'] == 'push':
              assert os.environ['REF'] == 'v' + version, 'Git tag must match pyproject.toml'
          image = os.environ['IMAGE']
          assert re.fullmatch(r'[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9._-]*', image), 'Set DOCKERHUB_IMAGE to namespace/repository'
          assert os.environ['LOGIN'], 'Set DOCKERHUB_USERNAME'
          tags = [image + ':' + version]
          if os.environ.get('UPDATE_LATEST') == 'true':
              tags.append(image + ':latest')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('version=' + version + '\ntags<<IMAGE_TAGS\n' + '\n'.join(tags) + '\nIMAGE_TAGS\n')
          PY
      - uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=GPUStack WorkerSim
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Verify published image
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker run --rm "$IMAGE@$DIGEST" --version
